providers:
  deepseek:
    baseUrl: https://api.deepseek.com
  # One front door for every local engine: llama-swap behind Caddy (infra repo, bin/ai-client.sh).
  # The same URL works at home and away. The key is read from the AI_API_KEY environment variable.
  local-inference:
    baseUrl: https://ai.lab.raulcorreia.dev/v1
    apiKey: AI_API_KEY
    authHeader: true
    compat:
      supportsReasoningEffort: true
      reasoningContentField: reasoning_content
      requiresReasoningContentForToolCalls: true
      supportsStrictMode: false
      supportsDeveloperRole: true
      supportsStore: false
      supportsReasoningParams: true
      reasoningEffortMap:
        minimal: low
        high: xhigh
        max: xhigh
    models:
    - id: qwen3.8-flash-next
      name: Qwen3.8 Flash Next (basalt)
      api: openai-completions
      reasoning: true
      input:
      - text
      - image   # basalt dynamic vision (config: server.vision=dynamic); verified 2026-10-30
      contextWindow: 262144
      maxTokens: 262144
      omitMaxOutputTokens: true
      thinking:
        mode: effort
        efforts:
        - low
        - medium
        - xhigh
        defaultLevel: xhigh
        requiresEffort: false
      compat:
        supportsReasoningParams: true
        thinkingFormat: qwen-chat-template
        qwenTemplateReasoningEffort: true
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
      tokenizer: qwen3
    - id: qwen3.8-flash-next-abliterated
      name: Qwen3.8 Flash Next (basalt)
      api: openai-completions
      reasoning: true
      input:
      - text
      - image   # basalt dynamic vision (config: server.vision=dynamic); verified 2026-10-30
      contextWindow: 262144
      maxTokens: 262144
      omitMaxOutputTokens: true
      thinking:
        mode: effort
        efforts:
        - low
        - medium
        - xhigh
        defaultLevel: xhigh
        requiresEffort: false
      compat:
        supportsReasoningParams: true
        thinkingFormat: qwen-chat-template
        qwenTemplateReasoningEffort: true
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
      tokenizer: qwen3
    - id: glm-5.3-flash-maya
      name: GLM-5.3 Flash (maya)
      api: openai-completions
      reasoning: true
      input:
      - text
      - image
      contextWindow: 131072
      maxTokens: 131072
      omitMaxOutputTokens: true
      thinking:
        mode: effort
        efforts:
        - low
        - high
        - max
        defaultLevel: max
        requiresEffort: false
      compat:
        supportsReasoningParams: true
        thinkingFormat: zai
        reasoningEffortMap:
          minimal: low
          low: low
          medium: high
          high: high
          xhigh: max
          max: max
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
      tokenizer: glm5
    api: openai-completions
