# Per-machine package additions, keyed by host name (asked on `chezmoi init`, default `hostname`).
# The profile (personal or work) says what a machine is for; this file says what the machine itself
# needs (desktop environment, hardware). A machine with no entry just gets its profile's packages.
# Managers: apt, pacman, aur, brew, cask.
# SSH hosts are deliberately not here: they stay on each machine, in ~/.ssh/config.d/.
hosts:
  talos: # desktop, Arch
    packages:
      pacman:
        - docker
        - docker-buildx
        - docker-compose
  p14s: # laptop, Arch
    packages: {}
  work-laptop: # work laptop, Ubuntu, KDE
    packages:
      apt:
        # KDE replacements for the removed GNOME apps
        - okular
        - gwenview
        - ark
        - kde-spectacle
        - print-manager
        - kdeconnect
        - kdialog
