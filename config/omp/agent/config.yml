providers:
  webSearchOrder:
    []
  memoryModel: qwen3-1.7b
  maxInFlightRequests:
    ninfer: 1
  openai-codex:
    codeMode: "on"
setupVersion: 2
modelRoles:
  commit: opencode-zen/muse-spark-1.3-contributor-free:minimal
  task: opencode-zen/muse-spark-1.3-contributor-free:medium
  default: opencode-go/muse-spark-1.3-contributor
  smol: opencode-go/muse-spark-1.3-contributor:auto
  tiny: opencode-go/muse-spark-1.3-contributor:auto
  advisor: opencode-go/muse-spark-1.3-contributor:xhigh
retry:
  fallbackChains:
    task:
      - opencode-go/muse-spark-1.3-contributor
    commit:
      - opencode-go/muse-spark-1.3-contributor
theme:
  dark: titanium
images:
  blockImages: true
symbolPreset: nerd
statusLine:
  preset: default
  separator: powerline-thin
  transparent: false
  compactThinkingLevel: false
terminal:
  showProgress: false
tui:
  textSizing: false
  tight: true
  scrollbackRebuild: false
  codexResetFireworks: true
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: false
steeringMode: one-at-a-time
doubleEscapeAction: rewind
compaction:
  thresholdPercent: -1
  thresholdTokens: -1
  handoffSaveToDisk: false
  methodOrder:
    - snapcompact
    - remote
    - soft
edit:
  mode: hashline
readLineNumbers: true
read:
  renderMarkdown: false
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: false
astGrep:
  enabled: true
github:
  enabled: true
plan:
  defaultOnStartup: false
task:
  eager: default
  agentModelOverrides:
    scout: "@smol:low"
  enableEffort: true
  maxConcurrency: 4
  maxEffort: high
  prewalk: true
  isolation:
    enabled: true
hideThinkingBlock: true
defaultThinkingLevel: auto
composer:
  shape: rule
dev:
  autoqaConsent: granted
tier:
  openai: none
memory:
  backend: mnemopi
autolearn:
  enabled: false
computer:
  enabled: true
secrets:
  enabled: true
disabledExtensions:
  []
eval:
  autoBackground:
    enabled: true
tasks:
  todoClearDelay: 0
python:
  kernelMode: session
shellMinimizer:
  enabled: true
  sourceOutlineLevel: default
isolation:
  backend: auto
codexResets:
  autoRedeem: "yes"
advisor:
  enabled: false